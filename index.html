<title>Aether</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: JARVIS-style command center, Platinum Ice accent. HUD-bracketed glass rail | main stage with a 3D agent neural network | always-on activity feed, over grid, scanlines and one ambient glow.
   Earlier note: command-center shell. Floating glass rail | main stage | always-on activity feed, over one soft ambient glow. Dark-only by design. */
:root{
  color-scheme: dark;
  --bg:#03070e;
  --bg-raise:#0b1222;
  --glass:rgba(130,165,255,.05);
  --glass-hi:rgba(130,165,255,.09);
  --glass-solid:rgba(10,16,31,.92);
  --line:rgba(165,195,255,.11);
  --line-hi:rgba(165,195,255,.22);
  --fg:#e7eefc;
  --muted:#94a4c5;
  --dim:#5f6e8f;
  --accent:#9fb6d6;
  --accent-hi:#eef4ff;
  --hud:rgba(238,244,255,.6);
  --accent-soft:rgba(159,182,214,.15);
  --on-accent:#03101f;
  --ok:#3ddc97;
  --warn:#f5b84a;
  --err:#ff6b6b;
  --idle:#7c8bab;
  --f-display:"Rajdhani","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-lg:4px; --r-md:8px; --r-sm:6px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ambient glow: the one motion behind the shell */
.glow{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 35% at 30% 20%, rgba(159,182,214,.20), transparent 70%),
    radial-gradient(35% 30% at 80% 85%, rgba(120,140,170,.12), transparent 70%);
  animation:drift 36s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.06)}}

/* glass */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(238,244,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(238,244,255,.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 80%)}
.scan{position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(238,244,255,.022) 0 1px,transparent 1px 3px)}
.glass{position:relative}
.glass::before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:1;--l:12px;--t:1.5px;
  background:linear-gradient(var(--hud),var(--hud)) 0 0/var(--l) var(--t),linear-gradient(var(--hud),var(--hud)) 0 0/var(--t) var(--l),
    linear-gradient(var(--hud),var(--hud)) 100% 0/var(--l) var(--t),linear-gradient(var(--hud),var(--hud)) 100% 0/var(--t) var(--l),
    linear-gradient(var(--hud),var(--hud)) 0 100%/var(--l) var(--t),linear-gradient(var(--hud),var(--hud)) 0 100%/var(--t) var(--l),
    linear-gradient(var(--hud),var(--hud)) 100% 100%/var(--l) var(--t),linear-gradient(var(--hud),var(--hud)) 100% 100%/var(--t) var(--l);
  background-repeat:no-repeat}
.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass));border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}

/* shell */
.app{position:relative;z-index:1;height:100%;display:grid;gap:12px;
  grid-template-columns:72px minmax(0,1fr) 320px;
  grid-template-rows:56px minmax(0,1fr);
  grid-template-areas:"rail top top" "rail main feed";
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

.rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.brand-mark{width:46px;height:46px;margin-bottom:12px;filter:drop-shadow(0 0 10px rgba(238,244,255,.55))}
/* arc reactor */
.reactor svg{width:100%;height:100%;overflow:visible;display:block}
.reactor circle{stroke:var(--accent-hi);transform-box:fill-box;transform-origin:center}
.reactor circle:not(.core){fill:none}
.reactor .core{stroke:none}
.reactor .r1{stroke-width:1.2;stroke-dasharray:2 5;opacity:.7;animation:spin 30s linear infinite}
.reactor .r4{stroke-width:6;stroke-dasharray:3 4;opacity:.55;animation:spin 22s linear infinite}
.reactor .r2{stroke-width:3;stroke-dasharray:28 14;opacity:.9;animation:spin 14s linear infinite reverse}
.reactor .r3{stroke-width:1;opacity:.5}
.voice{display:flex;align-items:center;gap:14px}
.voice .reactor{width:64px;height:64px;flex:none}
.voice b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-hi)}
.voice small{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.voice.speaking .reactor{animation:breathe 1.2s ease-in-out infinite}
.voice.speaking .r2{animation-duration:2.2s}
.voice.speaking .r1{animation-duration:6s}
.voice.speaking .r4{animation-duration:4s}
@keyframes breathe{50%{transform:scale(1.07);filter:drop-shadow(0 0 16px rgba(238,244,255,.75))}}
.nav-btn{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.nav-btn svg{width:22px;height:22px}
.nav-btn:hover{background:var(--glass-hi);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-hi);box-shadow:inset 0 0 0 1px rgba(159,182,214,.35)}
.nav-btn .nav-label{display:none}
.nav-btn .tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--glass-solid);border:1px solid var(--line-hi);padding:4px 9px;border-radius:8px;font-size:12.5px;color:var(--fg);opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.nav-btn:hover .tip,.nav-btn:focus-visible .tip{opacity:1}
.nav-btn .badge{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
.rail-spacer{flex:1}
.rail-kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);text-align:center;line-height:1.3}

.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;min-width:0}
.top-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-hi);text-shadow:0 0 14px rgba(238,244,255,.45)}
.crumb{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb::before{content:"/";margin-right:10px;color:var(--dim)}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 12px;width:min(380px,40%);border-radius:11px;border:1px solid var(--line);background:rgba(4,8,18,.5);color:var(--dim);font-size:14px;transition:border-color .2s}
.cmdk:hover{border-color:var(--line-hi);color:var(--muted)}
.cmdk svg{width:16px;height:16px;flex:none}
.cmdk span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-hi);color:var(--muted);background:rgba(255,255,255,.03)}
.sys{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.sys b{color:var(--fg);font-weight:600}
.clock{font-family:var(--f-mono);font-size:12.5px;color:var(--dim);white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line-hi)}
.icon-btn svg{width:18px;height:18px}
.feed-toggle{display:none}

/* status dots */
.dot{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)} .dot.idle{background:var(--idle)}
.dot.ok.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:ping 1.8s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(61,220,151,.28);background:rgba(61,220,151,.07)}
.pill.warn{color:var(--warn);border-color:rgba(245,184,74,.3);background:rgba(245,184,74,.07)}
.pill.err{color:var(--err);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.07)}

/* stage */
.stage{grid-area:main;min-height:0;min-width:0;overflow:auto;border-radius:var(--r-lg);scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
.view{padding:6px 4px 28px;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 4px 18px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent-hi);font-weight:600;margin-bottom:6px}
.vh h1{font-family:var(--f-display);font-size:clamp(28px,3.2vw,40px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.lede{color:var(--muted);margin-top:6px;max-width:62ch}

.panel{padding:18px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
.ph h2::before{content:"";width:6px;height:6px;border:1px solid var(--accent-hi);transform:rotate(45deg);flex:none}
.link{color:var(--accent-hi);font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line-hi);font-size:13.5px;font-weight:600;color:var(--fg);background:rgba(255,255,255,.03);transition:background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--glass-hi);border-color:rgba(165,195,255,.32)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.danger{color:var(--err);border-color:rgba(255,107,107,.35)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--glass-hi)}

.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;border:1px solid var(--line);background:rgba(4,8,18,.4);flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-hi)}
.seg .c{font-family:var(--f-mono);font-size:11px;color:var(--dim)}

.bar{height:4px;border-radius:4px;background:rgba(165,195,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));border-radius:4px;transition:width .9s var(--ease)}

.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--accent-hi);background:var(--accent-soft);border:1px solid rgba(159,182,214,.3);flex:none;position:relative}
.avatar .dot{position:absolute;right:-3px;bottom:-3px;box-shadow:0 0 0 3px var(--bg-raise)}

/* overview */
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s{font-size:12.5px;color:var(--dim)}
button.stat{transition:border-color .2s}
button.stat:hover{border-color:var(--line-hi)}
.stat.alert .v{color:var(--warn)}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}
.orbit-panel{grid-column:span 2;grid-row:span 2;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,rgba(159,182,214,.12),transparent 62%),linear-gradient(180deg,var(--glass-hi),var(--glass))}
.orbit-panel canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.orbit-panel canvas:active{cursor:grabbing}
.hud{position:absolute;z-index:2;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none;display:flex;flex-direction:column;gap:3px;line-height:1.5}
.hud b{color:var(--accent-hi);font-weight:500}
.hud-tl{top:16px;left:18px}
.hud-tr{top:16px;right:18px;text-align:right}
.hud-bl{bottom:14px;left:18px;flex-direction:row;gap:14px;flex-wrap:wrap}
.hud-bl span{display:inline-flex;align-items:center;gap:6px}
.hud-br{bottom:14px;right:18px}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 8px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;padding:6px 4px;border-radius:6px}
button.gauge:hover{background:var(--glass-hi)}
.g-ring{position:relative;width:84px;height:84px}
.g-ring svg{width:100%;height:100%;display:block}
.g-ring circle{fill:none}
.g-ticks{stroke:var(--line-hi);stroke-width:3;stroke-dasharray:1 4.24}
.g-track{stroke:rgba(238,244,255,.1);stroke-width:4}
.g-val{stroke:var(--accent-hi);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(238,244,255,.6))}
.gauge.warn .g-val{stroke:var(--warn);filter:drop-shadow(0 0 4px rgba(245,184,74,.6))}
.g-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums}
.gauge.warn .g-num{color:var(--warn)}
.g-lbl{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-top:4px}
.g-sub{font-size:11.5px;color:var(--dim)}
.pulse-panel{display:flex;flex-direction:column}
.pulse-wrap{position:relative;flex:1;min-height:130px}
.pulse-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.pulse-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pulse-meta b{font-family:var(--f-mono);color:var(--fg);font-weight:500}
.crew{display:flex;flex-direction:column;gap:2px}
.crew button{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;min-width:0}
.crew button:hover{background:var(--glass-hi)}
.crew .n{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .st{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tasks{display:flex;flex-direction:column;gap:14px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.task .avatar{grid-row:span 2;width:34px;height:34px;font-size:11px}
.task .t{font-size:14px;min-width:0}
.task .t b{font-weight:600}
.task .t span{color:var(--muted)}
.task .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.task .bar{grid-column:2/4}
.empty{color:var(--dim);font-size:14px;padding:8px 0}
.mems-mini{display:flex;flex-direction:column;gap:12px}
.mem-mini{display:flex;flex-direction:column;gap:3px;padding-left:12px;border-left:2px solid rgba(159,182,214,.35)}
.mem-mini p{font-size:14px}
.mem-mini small{font-size:12px;color:var(--dim)}

/* feed */
.feed{grid-area:feed;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.feed-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.feed-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;flex:1}
.feed-close{display:none}
.feed-list{list-style:none;margin:0;padding:6px 10px 14px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 8px;border-radius:10px}
.fi.new{animation:flash 1.6s var(--ease)}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.fi .ico{grid-row:span 2;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--glass-hi);border:1px solid var(--line);color:var(--muted);margin-top:1px}
.fi .ico svg{width:13px;height:13px}
.fi.done .ico{color:var(--ok)} .fi.warn .ico{color:var(--warn)} .fi.err .ico{color:var(--err)} .fi.mem .ico,.fi.you .ico{color:var(--accent-hi)}
.fi p{font-size:13.5px;line-height:1.4}
.fi p b{font-weight:600}
.fi small{font-size:11.5px;color:var(--dim);font-family:var(--f-mono)}

/* assistant */
.asst{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;height:calc(100% - 4px)}
.view.full{height:100%;display:flex;flex-direction:column;padding-bottom:4px}
.view.full .vh{flex:none}
.view.full > .asst{flex:1;min-height:0}
.chat{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.chat-log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
.msg{max-width:min(640px,92%);display:flex;flex-direction:column;gap:8px}
.msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(159,182,214,.3);padding:10px 14px;border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start}
.msg.ai .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.msg.ai .who i{width:18px;height:18px;border-radius:6px;background:radial-gradient(circle at 35% 30%,var(--accent-hi),var(--accent) 60%,#4a5d78)}
.msg .text{white-space:pre-wrap;font-size:15px;line-height:1.6}
.msg .text.typing::after{content:"";display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--accent-hi);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:rgba(4,8,18,.45);font-size:12.5px;color:var(--muted);max-width:100%}
.chip svg{width:13px;height:13px;flex:none;color:var(--accent-hi)}
.chip b{color:var(--fg);font-weight:600;white-space:nowrap}

function ago(t){
  const d = Date.now() - t;
  if (d < 45e3) return 'just now';
  if (d < HOUR) return Math.round(d / MIN) + 'm ago';
  if (d < DAY) return Math.round(d / HOUR) + 'h ago';
  return Math.round(d / DAY) + 'd ago';
}
function until(t){
  const d = t - Date.now();
  if (d < MIN) return 'in <1m';
  if (d < HOUR) return 'in ' + Math.round(d / MIN) + 'm';
  if (d < DAY) return 'in ' + Math.round(d / HOUR) + 'h';
  return 'in ' + Math.round(d / DAY) + 'd';
}
function dur(ms){ const s = Math.round(ms / 1000); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'; }

/* ---------- agent behavior ---------- */
function startTask(a, task){
  const st = S.agents[a.id];
  const options = a.tasks.filter(x => x !== st.task);
  st.status = 'running'; st.paused = false; st.progress = 0; st.started = Date.now();
  st.task = task || pick(options.length ? options : a.tasks);
  log(a.id, 'info', 'start · ' + st.task);
  feed(a.id, 'started ' + lcFirst(st.task), 'start');
  save();
}
function finishTask(a){
  const st = S.agents[a.id];
  st.history.unshift({at:Date.now(), text:st.task, ok:true, ms:Date.now() - st.started});
  st.history = st.history.slice(0, 8);
  S.done++;
  log(a.id, 'info', 'done · ' + st.task);
  feed(a.id, 'finished ' + lcFirst(st.task), 'done');
  if (chance(.4)) writeMemory(a);
  if (a.id === 'bills' && chance(.45)) {
    st.status = 'waiting'; st.task = a.waitTask; st.progress = 0;
    log(a.id, 'warn', 'approval needed · bank.pay(payee="City Power", amount=84.20)');
    feed(a.id, 'needs your OK to pay the electric bill', 'warn');
  } else if (chance(.28)) {
    st.status = 'idle'; st.task = 'Resting until the next trigger'; st.progress = 0;
  } else {
    startTask(a);
  }
  save();
}
function failTask(a){
  const st = S.agents[a.id];
  st.history.unshift({at:Date.now(), text:st.task, ok:false, ms:Date.now() - st.started});
  st.status = 'error'; st.task = a.errorTask; st.progress = 0;
  log(a.id, 'error', 'request timed out after 30000ms · retries exhausted');
  feed(a.id, "hit an error and stopped", 'err');
  save();
}

  const fresh = (a.mems || []).filter(m => !S.memories.some(x => x.text === m));

function keepFocus(fn){
  const a = document.activeElement;
  const key = a && a.dataset && a.dataset.act ? [a.dataset.act, a.dataset.id] : null;
  fn();
  if (key) {
    const el = document.querySelector(`[data-act="${key[0]}"]${key[1] ? `[data-id="${key[1]}"]` : ''}`);

}

let pulseColors;
function drawPulse(){
  const c = $('#pulse');
  if (!c || !c.offsetParent) return;
  if (!pulseColors) { const cs = getComputedStyle(document.documentElement); pulseColors = {a:cs.getPropertyValue('--accent').trim(), hi:cs.getPropertyValue('--accent-hi').trim(), line:cs.getPropertyValue('--line').trim(), dim:cs.getPropertyValue('--dim').trim()}; }
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  const pad = {t:10, b:18, r:10};
  const sm = PULSE.map((v, i) => (PULSE[i - 1] ?? v) * .25 + v * .5 + (PULSE[i + 1] ?? v) * .25);
  const max = Math.max(6, ...sm) * 1.15;
  x.strokeStyle = pulseColors.line; x.lineWidth = 1;
  x.font = '10.5px "JetBrains Mono", monospace'; x.fillStyle = pulseColors.dim;
  for (let i = 0; i <= 2; i++) {
    const y = pad.t + (h - pad.t - pad.b) * i / 2;
    x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke();
  }
  x.fillText('−90s', 0, h - 4);
  const nowLbl = 'now'; x.fillText(nowLbl, w - x.measureText(nowLbl).width - 2, h - 4);
  const n = PULSE.length;
  if (n < 2) return;
  const span = w - pad.r, offset = (60 - n) / 59 * span;
  const pts = sm.map((v, i) => [offset + i / 59 * span, pad.t + (1 - v / max) * (h - pad.t - pad.b)]);
  const path = () => {
    x.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) { const mx = (pts[i - 1][0] + pts[i][0]) / 2; x.bezierCurveTo(mx, pts[i - 1][1], mx, pts[i][1], pts[i][0], pts[i][1]); }
  };
  const g = x.createLinearGradient(0, pad.t, 0, h - pad.b);
  g.addColorStop(0, 'rgba(159,182,214,.35)'); g.addColorStop(1, 'rgba(159,182,214,0)');
  x.beginPath(); path(); x.lineTo(pts[n - 1][0], h - pad.b); x.lineTo(pts[0][0], h - pad.b); x.closePath(); x.fillStyle = g; x.fill();
  x.beginPath(); path(); x.strokeStyle = pulseColors.hi; x.lineWidth = 1.8; x.stroke();
  const [ex, ey] = pts[n - 1];
  x.beginPath(); x.arc(ex, ey, 7, 0, Math.PI * 2); x.fillStyle = 'rgba(159,182,214,.25)'; x.fill();
  x.beginPath(); x.arc(ex, ey, 3.5, 0, Math.PI * 2); x.fillStyle = pulseColors.hi; x.fill();
}

async function sendChat(text){
  text = (text || '').trim();
  if (!text || UI.busy) return;
  UI.busy = true;
  setVoice('Thinking…');
  const user = {role:'user', text};
  CHAT.push(user);
  const logEl = $('#chat-log');
  logEl.appendChild(msgEl(user, true));
  const r = REPLIES.find(r => r.k.test(text)) || FALLBACK;
  const m = {role:'ai', text:'', tools:r.tools, mems:r.mems};
  const el = msgEl(m, false);
  logEl.appendChild(el); scrollChat();
  const chips = el.querySelector('.chips'), body = el.querySelector('.text');
  body.classList.add('typing');
  for (const t of r.tools) {
    const span = document.createElement('span');
    span.innerHTML = chipHTML(t, false);
    const chip = span.firstElementChild;
    chips.appendChild(chip); scrollChat();
    log('assistant', t[0] === 'memory' ? 'mem' : 'tool', `${t[1].toLowerCase()} · ${t[2]}`);
    await wait(reduced() ? 120 : rand(500, 900));
    chip.outerHTML = chipHTML(t, true);
  }
  if (r.save) addMemory(text.replace(/^(please\s+)?(remember|note that|save)( that)?[:,]?\s*/i, ''), 'Assistant chat');
  r.mems.forEach(id => { const mm = memById(id); if (mm) mm.uses++; });
  UI.usedMems = r.mems.slice();
  renderUsed(true);
  setVoice('Responding…');
  const words = r.text.split(/(\s+)/);
  for (const w of words) {
    m.text += w; body.textContent = m.text;
    if (!reduced() && w.trim()) { scrollChat(); await wait(rand(16, 46)); }
  }
  body.classList.remove('typing');
  el.insertAdjacentHTML('beforeend', usedLine(m));
  CHAT.push(m);
  scrollChat();
  UI.busy = false;
  setVoice(null);
  save();
}

/* ============ NEURAL: agents as hub neurons in a layered 3D network ============ */
const Orbit = (() => {
  let cv = null, ctx = null, ro = null, w = 0, h = 0, dpr = 1, raf = 0, active = false, last = 0, T = 0;
  let yawOff = 0, pitch = .14, drag = null, hover = null, cx = 0, cy = 0, scale = 1;
  const D = 12, pulses = [], hits = [];
  const SOURCES = [['gmail','Gmail'],['cal','Calendar'],['chat','Chat'],['web','Web'],['files','Files'],['bank','Bank'],['photos','Photos']];
  const MEMS = [['people','People'],['home','Home'],['health','Health'],['fin','Finance'],['travel','Travel']];
  const TOOLS = {inbox:['gmail','cal','chat'], scout:['web','files'], bills:['bank','gmail','files'], photos:['photos','files'], trips:['web','cal'], garden:['chat','files']};
  const WRITES = {inbox:['home','people'], scout:['home','health'], bills:['fin'], photos:['people','travel'], trips:['travel'], garden:['health','fin','people']};
  const column = (n, x, spread) => Array.from({length:n}, (_, i) => {
    const u = n === 1 ? .5 : i / (n - 1);
    return [x, spread * (1 - 2 * u), -.9 * (1 - (2 * u - 1) ** 2) + (i % 2 ? .15 : -.1)];
  });
  // phones get the same network turned on its side: layers flow top to bottom
  const row = (n, y, spread) => Array.from({length:n}, (_, i) => {
    const u = n === 1 ? .5 : i / (n - 1);
    return [spread * (2 * u - 1), y, -.7 * (1 - (2 * u - 1) ** 2) + (i % 2 ? .12 : -.08)];
  });
  const PH = {}, PV = {};
  column(SOURCES.length, -4.0, 2.55).forEach((p, i) => PH['s:' + SOURCES[i][0]] = p);
  column(AGENTS.length, -1.6, 2.75).forEach((p, i) => PH['a:' + AGENTS[i].id] = p);
  column(MEMS.length, 1.45, 2.1).forEach((p, i) => PH['m:' + MEMS[i][0]] = p);
  PH.core = [3.9, 0, -.3];
  row(SOURCES.length, 3.9, 2.7).forEach((p, i) => PV['s:' + SOURCES[i][0]] = p);
  row(AGENTS.length, 1.3, 2.6).forEach((p, i) => PV['a:' + AGENTS[i].id] = p);
  row(MEMS.length, -1.3, 2.2).forEach((p, i) => PV['m:' + MEMS[i][0]] = p);
  PV.core = [0, -3.25, -.3];
  let P = PH, vert = false;
  const LAYERS_H = [['SOURCES', -4.0, 3.35], ['AGENTS', -1.6, 3.35], ['MEMORY', 1.45, 3.35], ['CORE', 3.9, 3.35]];
  const LAYERS_V = [['SOURCES', 0, 4.55], ['AGENTS', 0, 1.95], ['MEMORY', 0, -.66]];
  const DUST = Array.from({length:260}, () => [rand(-6, 6), rand(-3.6, 3.6), rand(-3, 4), Math.random()]);
  const DUST_EDGES = [];
  DUST.forEach((a, i) => {
    DUST.map((b, j) => [j, (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2]).filter(x => x[0] !== i).sort((x, y) => x[1] - y[1]).slice(0, 2)
      .forEach(([j, d]) => { if (d < 2.2 && i < j) DUST_EDGES.push([i, j]); });
  });
  let C;
  const tokens = () => { const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim(); C = {a:g('--accent'), hi:g('--accent-hi'), ok:g('--ok'), warn:g('--warn'), err:g('--err'), idle:g('--idle'), fg:g('--fg'), muted:g('--muted'), dim:g('--dim')}; };
  const rgba = (hex, a) => { hex = hex.replace('#', ''); const n = parseInt(hex, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const stc = s => ({running:C.ok, waiting:C.warn, error:C.err, idle:C.idle})[s];
  const rx = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; };
  const ry = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; };
  let yaw = 0;
  function proj(p){ let q = ry(p, yaw); q = rx(q, -pitch); const k = D / (D + q[2]); return {x:cx + q[0] * scale * k, y:cy - q[1] * scale * k, z:q[2], k}; }
  function glowDot(x, y, r, col, a = .95){ const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, rgba(col, a)); g.addColorStop(.3, rgba(col, a * .35)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill(); }
  function edges(){
    const out = [];
    for (const a of AGENTS) {
      const st = S.agents[a.id].status;
      TOOLS[a.id].forEach(s => out.push({from:'s:' + s, to:'a:' + a.id, st}));
      WRITES[a.id].forEach(m => out.push({from:'a:' + a.id, to:'m:' + m, st}));
    }
    MEMS.forEach(m => out.push({from:'m:' + m[0], to:'core', st:'mem'}));
    return out;
  }
  function curve(p0, p1){
    const dx = p1.x - p0.x, dy = p1.y - p0.y, L = Math.hypot(dx, dy) || 1, b = Math.min(28, L * .07);
    const mx = (p0.x + p1.x) / 2 + dy / L * b, my = (p0.y + p1.y) / 2 - dx / L * b;
    return t => [(1 - t) ** 2 * p0.x + 2 * (1 - t) * t * mx + t * t * p1.x, (1 - t) ** 2 * p0.y + 2 * (1 - t) * t * my + t * t * p1.y];
  }
  function draw(){
    if (!cv || !w || !h) return;
    if (!C) tokens();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    vert = w < 560; P = vert ? PV : PH;
    if (vert) { cx = w * .5; cy = h * .53; scale = Math.min(w / 6.4, h / 10.8); }
    else { cx = w * .555; cy = h * .53; scale = Math.min(w / 9.8, h / 7.4); }
    yaw = (vert ? 0 : -.2) + yawOff + (reduced() ? 0 : Math.sin(T * .18) * (vert ? .16 : .22));
    // background neural mesh
    const dp = DUST.map(proj);

/* ============ SIMULATION LOOP ============ */
function tick(){
  let events = 0;
  for (const a of AGENTS) {
    const st = S.agents[a.id];
    if (st.status === 'running') {
      st.progress = Math.min(1, st.progress + rand(.012, .055));
      if (chance(.42)) { const [lvl, msg] = pick(a.logs); log(a.id, lvl, msg); events++; }
      if (st.progress >= 1) { finishTask(a); events += 2; }
      else if (a.id === 'trips' && chance(.012)) { failTask(a); events++; }
    } else if (st.status === 'idle' && !st.paused && chance(.04)) {
      startTask(a); events++;
    }
  }
  if (chance(.08)) { log('system', 'info', 'heartbeat · 6 agents · memory store ok · ' + Math.round(rand(38, 61)) + 'ms'); events++; }
  PULSE.push(events + (chance(.3) ? 1 : 0));
  if (PULSE.length > 60) PULSE.shift();
  refresh();
  setTimeout(tick, rand(1100, 1900));
}

function seedRuntime(){
  const t = Date.now();
  for (let i = 59; i >= 0; i--) PULSE.push(Math.round(rand(1, 4)));
  const pool = AGENTS.filter(a => a.id !== 'photos');
  for (let i = 40; i > 0; i--) { const a = pick(pool); const [lvl, msg] = pick(a.logs); log(a.id, lvl, msg, t - i * rand(2500, 4500)); }
  log('trips', 'error', 'web.fetch(ana.co.jp/booking/hold) timed out after 30000ms', t - 4 * MIN);
  log('bills', 'warn', 'approval needed · bank.pay(payee="City Power", amount=84.20)', t - 3 * MIN);
  log('system', 'info', 'heartbeat · 6 agents · memory store ok · 44ms', t - 60e3);
  LOGS.sort((a, b) => a.at - b.at);
  const seedFeed = [
    ['photos', 'finished grouping 212 Lisbon photos into albums', 'done', 3*HOUR],
    ['inbox', 'flagged a message from Mom as Today', 'warn', 52*MIN],
    ['scout', 'saved a memory: "E-bike budget is up to $2,000…"', 'mem', 25*MIN],
    ['bills', 'filed 3 receipts to Finance/Receipts/2026', 'done', 18*MIN],
    ['garden', 'started merging duplicate notes about your running plan', 'start', 9*MIN],
    ['trips', 'hit an error and stopped', 'err', 4*MIN],
    ['bills', 'needs your OK to pay the electric bill', 'warn', 3*MIN],
  ];
  for (const [ag, text, kind, a] of seedFeed) FEED.unshift({id:++feedSeq, at:t - a, agent:ag, text, kind});
  CHAT.push({role:'user', text:'Anything I should know about today?'});
  CHAT.push({role:'ai', text:"Two things. Bill Watcher is holding the electric bill ($84.20) until you approve it. Trip Planner couldn't reach the airline site, so the Kyoto seat hold isn't confirmed yet. Everything else is running normally.",
    tools:[['agent','Checked agents','6 agents'],['cal','Read calendar','today']], mems:['m6']});
}

/* ============ COMMAND PALETTE ============ */
const PAL = {open:false, q:'', sel:0, items:[], prevFocus:null};
function paletteItems(q){
  const items = [];
  VIEWS.forEach((v, i) => items.push({g:'Go to', label:v.label, hint:String(i + 1), run:() => go(v.id)}));
  for (const a of AGENTS) {
    const s = S.agents[a.id].status;
    items.push({g:'Agents', label:'Open ' + a.name, hint:STATUS[s].label, run:() => { go('agents'); openDrawer(a.id); }});
    if (s === 'running') items.push({g:'Agents', label:'Pause ' + a.name, run:() => toggleAgent(a.id)});
    else if (s === 'waiting') items.push({g:'Agents', label:'Approve ' + a.name + ' request', run:() => approve(a.id)});
    else if (s === 'error') items.push({g:'Agents', label:'Retry ' + a.name, run:() => retry(a.id)});
    else items.push({g:'Agents', label:'Start ' + a.name, run:() => toggleAgent(a.id)});
  }
  items.push({g:'Actions', label:'Pause all agents', run:pauseAll});
  items.push({g:'Actions', label:'Start all idle agents', run:startAll});
  items.push({g:'Actions', label:'Show activity feed', run:() => setFeed(true)});
  for (const w of WORKFLOWS) items.push({g:'Workflows', label:`Run "${w.name}" now`, run:() => { UI.tab = 'workflows'; UI.wf = w.id; go('logs'); runWorkflow(w.id); }});
  items.push({g:'Actions', label:'Reset demo data', hint:'clears saved state', run:resetAll});
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  let out = terms.length ? items.filter(it => terms.every(t => (it.label + ' ' + it.g).toLowerCase().includes(t))) : items;
  if (q.trim()) {
    out = out.concat([
      {g:'Ask', label:`Ask Aether: "${q.trim()}"`, run:() => { go('assistant'); setTimeout(() => sendChat(q), 60); }},
      {g:'Ask', label:`Save as memory: "${q.trim()}"`, run:() => addMemory(q)},
    ]);
  }
  return out;
}
function openPalette(){
  if (PAL.open) return;
  PAL.open = true; PAL.q = ''; PAL.sel = 0; PAL.prevFocus = document.activeElement;
  const host = document.createElement('div');
  host.id = 'pal-host';
  host.innerHTML = `<div class="pal-scrim" data-pal-close><div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pal-in">${ICON.search}<label class="sr" for="pal-q">Command</label><input id="pal-q" placeholder="Type a command, an agent, or a question" role="combobox" aria-controls="pal-list" aria-expanded="true" autocomplete="off"><kbd>esc</kbd></div>
    <ul class="pal-list" id="pal-list" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>1</kbd>–<kbd>5</kbd> jump outside the palette</span></div>
  </div></div>`;
  document.body.appendChild(host);
  const inp = $('#pal-q');

  inp.addEventListener('keydown', e => {

    case 'mem-cancel': { const was = UI.editing; UI.editing = null; renderMemList(true); const b = document.querySelector(`[data-act="mem-edit"][data-id="${was}"]`); if (b) b.focus(); break; }
    case 'mem-del': UI.confirmDel = id; UI.memVer++; renderMemList(true); { const y = document.querySelector(`[data-act="mem-del-yes"]`); if (y) y.focus(); } break;
    case 'mem-del-no': UI.confirmDel = null; UI.memVer++; renderMemList(true); break;
    case 'mem-del-yes': {
      const m = memById(id);
      S.memories = S.memories.filter(x => x.id !== id); UI.confirmDel = null; UI.memVer++;
      if (m) { log('assistant', 'mem', 'delete memory "' + m.text + '"'); feed('assistant', 'deleted a memory at your request', 'you'); }
      save(); renderMemList(true); renderPreview(); toast('Memory deleted'); break;
    }
    case 'log-lvl': UI.logLvl = id; renderTerm(); break;
    case 'log-pause': UI.logPaused = !UI.logPaused; renderTerm(); break;
    case 'log-clear': LOGS.length = 0; renderTerm(); break;
    case 'tab': UI.tab = id; renderLogsTab(); { const t = document.querySelector(`[data-act="tab"][data-id="${id}"]`); if (t) t.focus(); } break;
    case 'wf-select': UI.wf = id; refreshWorkflows(); break;
    case 'wf-run': UI.wf = id; runWorkflow(id); break;
    case 'wf-toggle': { const s = S.wf[id]; s.on = !s.on; if (s.on && WF[id].nextH && (!s.next || s.next < Date.now())) s.next = Date.now() + WF[id].nextH * HOUR; feed('system', `${s.on ? 'turned on' : 'turned off'} the "${WF[id].name}" schedule`, 'you'); save(); refreshWorkflows(); break; }
    case 'suggest': go('assistant'); sendChat(el.dataset.text); break;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  // a button inside a card should not also open the card
  e.stopPropagation();
  act(el.dataset.act, el.dataset.id, el);
});

/* ============ KEYBOARD ============ */
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); PAL.open ? closePalette() : openPalette(); return; }
  if (PAL.open) return;
  if (e.key === 'Escape') {
    if (UI.drawer) { closeDrawer(); return; }
    if (UI.feedOpen) { setFeed(false); return; }
    if (UI.confirmDel) { act('mem-del-no'); return; }
  }
  if (UI.drawer && e.key === 'Tab') {
    const f = [...document.querySelectorAll('.drawer button')];
    if (f.length) {
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  }
  const t = e.target;
  if (typing(t) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (t && t.classList && t.classList.contains('ag') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(t.dataset.id); return; }
  if (/^[1-5]$/.test(e.key) && !UI.drawer) { go(VIEWS[+e.key - 1].id); return; }
  if (e.key === '/') { e.preventDefault(); openPalette(); }
});

/* ============ BOOT ============ */
seedRuntime();
$('#brand-reactor').innerHTML = reactorSVG('b');
renderFeed(false);
tickClock(); setInterval(tickClock, 1000);
setInterval(() => renderFeed(false), 30000);
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
window.addEventListener('resize', () => { if (UI.view === 'overview') drawPulse(); });
show(location.hash.slice(1) || 'overview');
setTimeout(tick, 900);
})();
</script>
